<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brys Projects — Meesterschap in afwerking</title>
<meta name="description" content="Brys Projects. Binnenafwerking, microcement en badkamers. Onze website is in opbouw. Contacteer ons.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%23678475%22/></svg>">
<style>
	:root {
		--green: #678475;
		--green-dark: #2C3C34;
		--paper: #F5F3EF;
	}

	* { box-sizing: border-box; }

	html, body {
		margin: 0;
		padding: 0;
	}

	body {
		min-height: 100vh;
		min-height: 100svh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 48px 24px;
		background: var(--paper);
		color: var(--green-dark);
		font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		font-size: 17px;
		line-height: 1.6;
		-webkit-font-smoothing: antialiased;
	}

	.card {
		width: 100%;
		max-width: 620px;
		text-align: center;
	}

	.logo {
		display: block;
		width: 100%;
		max-width: 300px;
		height: auto;
		margin: 0 auto;
	}

	.rule {
		width: 48px;
		height: 1px;
		margin: 40px auto;
		background: var(--green);
		opacity: .5;
		border: 0;
	}

	.intro {
		margin: 0 auto;
		max-width: 44ch;
		color: var(--green-dark);
	}

	.intro strong {
		font-weight: 600;
	}

	.contact {
		margin-top: 40px;
		display: flex;
		flex-wrap: wrap;
		gap: 12px 40px;
		justify-content: center;
	}

	.contact a {
		color: var(--green-dark);
		text-decoration: none;
		border-bottom: 1px solid var(--green);
		padding-bottom: 2px;
		transition: color .2s ease, border-color .2s ease;
	}

	.contact a:hover,
	.contact a:focus-visible {
		color: var(--green);
		border-color: var(--green-dark);
	}

	.label {
		display: block;
		font-size: 12px;
		letter-spacing: .12em;
		text-transform: uppercase;
		color: var(--green);
		margin-bottom: 6px;
	}

	@media (max-width: 480px) {
		body { font-size: 16px; }
		.rule { margin: 32px auto; }
		.contact { gap: 24px; }
	}
</style>
</head>
<body>
	<main class="card">
		<img class="logo" src="brys-projects_logo.png" width="500" height="221" alt="Brys Projects">

		<hr class="rule">

		<p class="intro">
			Onze nieuwe website is in opbouw.<br>
			Voor vragen of een offerte bereikt u ons rechtstreeks.
		</p>

		<div class="contact">
			<p>
				<span class="label">E-mail</span>
				<a href="mailto:info@brys-projects.be">info@brys-projects.be</a>
			</p>
		</div>
	</main>
</body>
</html>
