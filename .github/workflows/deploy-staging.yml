name: Deploy Staging

on:
    push:
        branches: [ staging ]

jobs:

    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              env:
                  ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
                  WP_PLUGIN_GF_KEY: ${{ secrets.WP_PLUGIN_GF_KEY }}
                  COMPOSER_AUTH: ${{ secrets.ACF_AUTH_JSON }}
              run: |
                  composer install --ignore-platform-reqs --no-dev
                  npm install

            - name: Build
              run: npm run build

            - name: Sync
              env:
                  dest: 'shared2be@ssh006.webhosting.be:/data/sites/web/shared2be/subsites/brys-projects.be/staging'
              run: |
                  echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
                  chmod 600 ./deploy_key
                  rsync -avh \
                    -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
                    --exclude /deploy_key \
                    --exclude /.git/ \
                    --exclude /.github/ \
                    --exclude /.ddev/ \
                    --exclude /.idea/ \
                    --exclude /.claude/ \
                    --exclude /.agents/ \
                    --exclude /.htaccess \
                    --exclude /.env \
                    --exclude /assets/ \
                    --exclude /copy/ \
                    --exclude /dev/ \
                    --exclude /landing/ \
                    --exclude /node_modules/ \
                    --exclude '/*.md' \
                    --exclude /skills-lock.json \
                    --exclude /web/.htaccess \
                    --exclude /web/.htpasswd \
                    --exclude /web/app/uploads/**/* \
                    --exclude '.DS_Store' \
                    ./ ${{env.dest}}
